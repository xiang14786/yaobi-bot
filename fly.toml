app = 'yaobi-bot-tw'
primary_region = 'sin'

[build]

[http_service]
  internal_port       = 8080
  force_https         = false
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    timeout      = "5s"

[mounts]
  source      = 'yaobi_data'
  destination = '/data'

[[vm]]
  memory   = '256mb'
  cpu_kind = 'shared'
  cpus     = 1
